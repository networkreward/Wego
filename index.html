<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Completely mock WebSocket to prevent Vite from attempting HMR connections
      window.WebSocket = function() {
        console.debug('WebSocket connection blocked by AI Studio');
        return {
          send: () => {},
          close: () => {},
          readyState: 3, // CLOSED
          addEventListener: () => {},
        };
      };

      // Filter out benign Vite HMR websocket connection errors in preview environments
      (function() {
        const isBenign = (msg) => {
          const str = (typeof msg === 'string' ? msg : (msg && msg.message) || (msg && msg.reason) || '').toLowerCase();
          return str.includes('vite') || str.includes('websocket') || str.includes('hmr');
        };

        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a && a.message) || '').join(' ');
          if (isBenign(msg)) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a && a.message) || '').join(' ');
          if (isBenign(msg)) {
            console.debug(...args);
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isBenign(event.message) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault?.();
            event.stopImmediatePropagation?.();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (isBenign(reason)) {
            event.preventDefault?.();
            event.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
