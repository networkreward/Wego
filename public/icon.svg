<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cocaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A24" />
      <stop offset="100%" stop-color="#C40007" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#cocaRed)" />

  <!-- Dynamic Wave Decoration -->
  <path d="M0 340 C140 280, 240 400, 380 340 C440 315, 480 320, 512 340 L512 512 L0 512 Z" fill="#ffffff" fill-opacity="0.08" />
  <path d="M0 380 C160 330, 260 440, 400 370 C460 340, 490 350, 512 370 L512 512 L0 512 Z" fill="#ffffff" fill-opacity="0.05" />

  <!-- Bottle Silhouette & Capital C / Star badge -->
