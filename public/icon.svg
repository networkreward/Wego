    <!-- Bottle silhouette -->
    <!-- Cap -->
    <rect x="238" y="105" width="36" height="18" rx="4" />
    <!-- Neck -->
    <path d="M243 123 L243 175 C243 190, 222 215, 218 235 L218 360 C218 375, 230 385, 245 385 L267 385 C282 385, 294 375, 294 360 L294 235 C290 215, 269 190, 269 175 L269 123 Z" />
